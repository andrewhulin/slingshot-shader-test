<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Shader Studio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Full-screen shader canvas -->
    <canvas id="glCanvas"></canvas>

    <!-- Right sidebar control panel -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="header-title">FIRE SHADER STUDIO</div>
            <div class="header-subtitle">Fire · Energy · Heat</div>
        </div>

        <div class="sidebar-content">
            <!-- Preset Buttons -->
            <section class="control-section">
                <label class="control-label">FIRE MODE</label>
                <div class="preset-grid">
                    <button class="preset-btn active" data-preset="flames">
                        <span class="preset-icon">🔥</span>
                        <span class="preset-name">Flames</span>
                    </button>
                    <button class="preset-btn" data-preset="inferno">
                        <span class="preset-icon">⬆</span>
                        <span class="preset-name">Inferno</span>
                    </button>
                    <button class="preset-btn" data-preset="embers">
                        <span class="preset-icon">●</span>
                        <span class="preset-name">Embers</span>
                    </button>
                    <button class="preset-btn" data-preset="sparks">
                        <span class="preset-icon">✦</span>
                        <span class="preset-name">Sparks</span>
                    </button>
                    <button class="preset-btn" data-preset="blaze">
                        <span class="preset-icon">☀</span>
                        <span class="preset-name">Blaze</span>
                    </button>
                    <button class="preset-btn" data-preset="corona">
                        <span class="preset-icon">◎</span>
                        <span class="preset-name">Corona</span>
                    </button>
                </div>
            </section>

            <!-- Heat Control -->
            <section class="control-section">
                <label class="control-label">HEAT</label>
                <div class="step-control">
                    <button class="step-btn active" data-value="0">Cool</button>
                    <button class="step-btn" data-value="1">Warm</button>
                    <button class="step-btn" data-value="2">Hot</button>
                    <button class="step-btn" data-value="3">Blazing</button>
                </div>
            </section>

            <!-- Intensity Control -->
            <section class="control-section">
                <label class="control-label">INTENSITY</label>
                <div class="step-control">
                    <button class="step-btn active" data-value="0">Low</button>
                    <button class="step-btn" data-value="1">Medium</button>
                    <button class="step-btn" data-value="2">High</button>
                </div>
            </section>

            <!-- Turbulence Control -->
            <section class="control-section">
                <label class="control-label">TURBULENCE</label>
                <div class="step-control">
                    <button class="step-btn active" data-value="0">Steady</button>
                    <button class="step-btn" data-value="1">Flickering</button>
                    <button class="step-btn" data-value="2">Chaotic</button>
                </div>
            </section>

            <!-- Color Harmony -->
            <section class="control-section">
                <label class="control-label">COLOR HARMONY</label>
                <div class="harmony-grid">
                    <button class="harmony-btn active" data-harmony="classic">
                        <div class="harmony-swatch">
                            <span style="background: #FF4500"></span>
                            <span style="background: #FF8C00"></span>
                            <span style="background: #FFD700"></span>
                        </div>
                        <span class="harmony-name">Classic Fire</span>
                    </button>
                    <button class="harmony-btn" data-harmony="infernal">
                        <div class="harmony-swatch">
                            <span style="background: #8B0000"></span>
                            <span style="background: #DC143C"></span>
                            <span style="background: #FF4500"></span>
                        </div>
                        <span class="harmony-name">Infernal</span>
                    </button>
                    <button class="harmony-btn" data-harmony="lava">
                        <div class="harmony-swatch">
                            <span style="background: #FF6347"></span>
                            <span style="background: #FF8C00"></span>
                            <span style="background: #4A0000"></span>
                        </div>
                        <span class="harmony-name">Molten Lava</span>
                    </button>
                    <button class="harmony-btn" data-harmony="ember">
                        <div class="harmony-swatch">
                            <span style="background: #8B4513"></span>
                            <span style="background: #D2691E"></span>
                            <span style="background: #FF7F50"></span>
                        </div>
                        <span class="harmony-name">Glowing Ember</span>
                    </button>
                    <button class="harmony-btn" data-harmony="plasma">
                        <div class="harmony-swatch">
                            <span style="background: #FF1493"></span>
                            <span style="background: #FF4500"></span>
                            <span style="background: #FFD700"></span>
                        </div>
                        <span class="harmony-name">Plasma</span>
                    </button>
                    <button class="harmony-btn" data-harmony="solar">
                        <div class="harmony-swatch">
                            <span style="background: #FFA500"></span>
                            <span style="background: #FFFF00"></span>
                            <span style="background: #FFFFFF"></span>
                        </div>
                        <span class="harmony-name">Solar Flare</span>
                    </button>
                </div>
            </section>

            <!-- Actions -->
            <section class="control-section">
                <button id="resetBtn" class="btn btn-secondary">RESET TIME</button>
                <button id="playBtn" class="btn btn-primary">
                    <span id="playText">PAUSE</span>
                </button>
                <button id="exportBtn" class="btn btn-secondary">EXPORT .FRAG</button>
            </section>

            <!-- Info -->
            <section class="control-section sidebar-footer">
                <div class="info-row">
                    <span class="info-label">FPS</span>
                    <span class="info-value" id="fpsCounter">0</span>
                </div>
                <div class="info-row">
                    <span class="info-label">TIME</span>
                    <span class="info-value" id="timeCounter">0.00s</span>
                </div>
            </section>
        </div>
    </div>

    <script src="shader-editor.js"></script>
</body>
</html>
