<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shader Studio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Full-screen shader canvas -->
    <canvas id="glCanvas"></canvas>

    <!-- Right sidebar control panel -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="header-title">SHADER STUDIO</div>
        </div>

        <div class="sidebar-content">
            <!-- Preset Selection -->
            <section class="control-section">
                <label class="control-label">PRESET</label>
                <select id="effectType" class="control-select">
                    <option value="warmglow">Warm Glow</option>
                    <option value="earthrise">Earth Rise</option>
                    <option value="sage">Sage Garden</option>
                    <option value="sunset">Sunset Fade</option>
                    <option value="terracotta">Terracotta Dream</option>
                    <option value="goldenhr">Golden Hour</option>
                    <option value="forest">Forest Path</option>
                    <option value="amber">Amber Waves</option>
                    <option value="zenstone">Zen Stone</option>
                    <option value="clay">Clay & Earth</option>
                    <option value="meadow">Meadow Breeze</option>
                    <option value="warmth">Inner Warmth</option>
                </select>
            </section>

            <!-- Animation -->
            <section class="control-section">
                <label class="control-label">ANIMATION</label>
                <div class="control-row">
                    <span class="control-sublabel">Speed</span>
                    <span class="control-value" id="speedValue">0.6</span>
                </div>
                <input type="range" id="speed" class="control-slider" min="0" max="3" step="0.1" value="0.6">

                <div class="control-row">
                    <span class="control-sublabel">Intensity</span>
                    <span class="control-value" id="complexityValue">1.2</span>
                </div>
                <input type="range" id="complexity" class="control-slider" min="0.1" max="3" step="0.1" value="1.2">

                <div class="control-row">
                    <span class="control-sublabel">Scale</span>
                    <span class="control-value" id="scaleValue">1.0</span>
                </div>
                <input type="range" id="scale" class="control-slider" min="0.1" max="5" step="0.1" value="1">
            </section>

            <!-- Colors -->
            <section class="control-section">
                <label class="control-label">COLORS</label>
                <div class="color-grid">
                    <input type="color" id="color1" class="color-input" value="#E67E50">
                    <input type="color" id="color2" class="color-input" value="#F5A962">
                    <input type="color" id="color3" class="color-input" value="#7D8F69">
                </div>

                <div class="control-row">
                    <span class="control-sublabel">Saturation</span>
                    <span class="control-value" id="colorIntensityValue">1.2</span>
                </div>
                <input type="range" id="colorIntensity" class="control-slider" min="0" max="2" step="0.1" value="1.2">
            </section>

            <!-- Pattern -->
            <section class="control-section">
                <label class="control-label">PATTERN</label>
                <div class="control-row">
                    <span class="control-sublabel">Flow</span>
                    <span class="control-value" id="distortionValue">0.5</span>
                </div>
                <input type="range" id="distortion" class="control-slider" min="0" max="2" step="0.1" value="0.5">

                <div class="control-row">
                    <span class="control-sublabel">Glow</span>
                    <span class="control-value" id="glowValue">0.3</span>
                </div>
                <input type="range" id="glow" class="control-slider" min="0" max="1" step="0.05" value="0.3">

                <div class="control-row">
                    <span class="control-sublabel">Brightness</span>
                    <span class="control-value" id="brightnessValue">1.1</span>
                </div>
                <input type="range" id="brightness" class="control-slider" min="0" max="2" step="0.1" value="1.1">
            </section>

            <!-- Actions -->
            <section class="control-section">
                <button id="randomizeBtn" class="btn btn-secondary">RANDOMIZE</button>
                <button id="resetBtn" class="btn btn-secondary">RESET TIME</button>
                <button id="playBtn" class="btn btn-primary">
                    <span id="playText">PAUSE</span>
                </button>
                <button id="exportBtn" class="btn btn-secondary">EXPORT .FRAG</button>
            </section>

            <!-- Info -->
            <section class="control-section sidebar-footer">
                <div class="info-row">
                    <span class="info-label">FPS</span>
                    <span class="info-value" id="fpsCounter">0</span>
                </div>
                <div class="info-row">
                    <span class="info-label">TIME</span>
                    <span class="info-value" id="timeCounter">0.00s</span>
                </div>
            </section>
        </div>
    </div>

    <script src="shader-editor.js"></script>
</body>
</html>
