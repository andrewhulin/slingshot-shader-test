<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shader Studio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Full-screen shader canvas -->
    <canvas id="glCanvas"></canvas>

    <!-- Right sidebar control panel -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="header-title">SHADER STUDIO</div>
            <div class="header-subtitle">Water · Thinking · Flow</div>
        </div>

        <div class="sidebar-content">
            <!-- Preset Buttons -->
            <section class="control-section">
                <label class="control-label">THINKING MODE</label>
                <div class="preset-grid">
                    <button class="preset-btn active" data-preset="ripples">
                        <span class="preset-icon">◯</span>
                        <span class="preset-name">Ripples</span>
                    </button>
                    <button class="preset-btn" data-preset="current">
                        <span class="preset-icon">≋</span>
                        <span class="preset-name">Current</span>
                    </button>
                    <button class="preset-btn" data-preset="deep">
                        <span class="preset-icon">●</span>
                        <span class="preset-name">Deep</span>
                    </button>
                    <button class="preset-btn" data-preset="surface">
                        <span class="preset-icon">∼</span>
                        <span class="preset-name">Surface</span>
                    </button>
                    <button class="preset-btn" data-preset="tide">
                        <span class="preset-icon">⟍</span>
                        <span class="preset-name">Tide</span>
                    </button>
                    <button class="preset-btn" data-preset="reflect">
                        <span class="preset-icon">◇</span>
                        <span class="preset-name">Reflect</span>
                    </button>
                </div>
            </section>

            <!-- Flow Control -->
            <section class="control-section">
                <label class="control-label">FLOW</label>
                <div class="step-control">
                    <button class="step-btn active" data-value="0">Still</button>
                    <button class="step-btn" data-value="1">Gentle</button>
                    <button class="step-btn" data-value="2">Moderate</button>
                    <button class="step-btn" data-value="3">Active</button>
                </div>
            </section>

            <!-- Depth Control -->
            <section class="control-section">
                <label class="control-label">DEPTH</label>
                <div class="step-control">
                    <button class="step-btn active" data-value="0">Shallow</button>
                    <button class="step-btn" data-value="1">Medium</button>
                    <button class="step-btn" data-value="2">Deep</button>
                </div>
            </section>

            <!-- Movement Control -->
            <section class="control-section">
                <label class="control-label">MOVEMENT</label>
                <div class="step-control">
                    <button class="step-btn active" data-value="0">Calm</button>
                    <button class="step-btn" data-value="1">Flowing</button>
                    <button class="step-btn" data-value="2">Dynamic</button>
                </div>
            </section>

            <!-- Color Harmony -->
            <section class="control-section">
                <label class="control-label">COLOR HARMONY</label>
                <div class="harmony-grid">
                    <button class="harmony-btn active" data-harmony="ash">
                        <div class="harmony-swatch">
                            <span style="background: #E67E50"></span>
                            <span style="background: #7D8F69"></span>
                            <span style="background: #F5A962"></span>
                        </div>
                        <span class="harmony-name">Ash Warmth</span>
                    </button>
                    <button class="harmony-btn" data-harmony="ocean">
                        <div class="harmony-swatch">
                            <span style="background: #4A90A4"></span>
                            <span style="background: #5AB1BB"></span>
                            <span style="background: #2D5F6D"></span>
                        </div>
                        <span class="harmony-name">Ocean Deep</span>
                    </button>
                    <button class="harmony-btn" data-harmony="forest">
                        <div class="harmony-swatch">
                            <span style="background: #6B8F71"></span>
                            <span style="background: #8FA888"></span>
                            <span style="background: #4A6B52"></span>
                        </div>
                        <span class="harmony-name">Forest Moss</span>
                    </button>
                    <button class="harmony-btn" data-harmony="sunset">
                        <div class="harmony-swatch">
                            <span style="background: #E88D67"></span>
                            <span style="background: #9B6B9E"></span>
                            <span style="background: #F4A261"></span>
                        </div>
                        <span class="harmony-name">Sunset Glow</span>
                    </button>
                    <button class="harmony-btn" data-harmony="moonlight">
                        <div class="harmony-swatch">
                            <span style="background: #7B8FA3"></span>
                            <span style="background: #A8B5C7"></span>
                            <span style="background: #4E5D6C"></span>
                        </div>
                        <span class="harmony-name">Moonlight</span>
                    </button>
                    <button class="harmony-btn" data-harmony="earth">
                        <div class="harmony-swatch">
                            <span style="background: #9B7E6F"></span>
                            <span style="background: #6B8FA3"></span>
                            <span style="background: #C4A57B"></span>
                        </div>
                        <span class="harmony-name">Earth & Sky</span>
                    </button>
                </div>
            </section>

            <!-- Actions -->
            <section class="control-section">
                <button id="resetBtn" class="btn btn-secondary">RESET TIME</button>
                <button id="playBtn" class="btn btn-primary">
                    <span id="playText">PAUSE</span>
                </button>
                <button id="exportBtn" class="btn btn-secondary">EXPORT .FRAG</button>
            </section>

            <!-- Info -->
            <section class="control-section sidebar-footer">
                <div class="info-row">
                    <span class="info-label">FPS</span>
                    <span class="info-value" id="fpsCounter">0</span>
                </div>
                <div class="info-row">
                    <span class="info-label">TIME</span>
                    <span class="info-value" id="timeCounter">0.00s</span>
                </div>
            </section>
        </div>
    </div>

    <script src="shader-editor.js"></script>
</body>
</html>
